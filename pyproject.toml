[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdeck"
version = "0.1.0"
description = "Local-first multi-agent terminal workbench"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AgentDeck Contributors" }]
dependencies = ["agent-client-protocol==0.11.0"]

[project.scripts]
agentdeck = "agentdeck.cli:main"
agentdeck-codex-acp = "agentdeck.adapters.codex_acp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
